name: Validate review and protocol
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test binary protocol
        run: python Firmware/tools/test_protocol.py
      - name: Verify frozen delivery and source snapshot
        run: python scripts/verify_review.py
